# Merge into .pre-commit-config.yaml of the target repository.
repos:
  # Official REUSE hooks. "reuse-lint-file" only checks the staged files.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse-lint-file
  # AI-specific checks from this plugin (snippets, markers, core paths).
  - repo: local
    hooks:
      - id: spdx-ai-markers
        name: SPDX AI markers
        entry: python3 .claude/skills/spdx-ai-annotation/scripts/check_spdx.py --no-header-check
        language: system
        types: [text]
